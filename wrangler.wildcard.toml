name = "curupira-subdomains"
main = "workers/subdomain-router.js"
compatibility_date = "2026-09-28"

# The Pages project continues to serve curupirasoftware.com. This Worker only
# receives subdomains through the wildcard route below.
[[routes]]
pattern = "*.curupirasoftware.com/*"
zone_name = "curupirasoftware.com"

[assets]
directory = "./dist-subdomains"
binding = "ASSETS"
run_worker_first = true
